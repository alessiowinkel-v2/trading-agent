# Dashboard: static GitHub Pages site built from memory/ by scripts/dashboard.py.
# No secrets, no API calls. Runs on routine pushes and every 30 min (pushes made by the
# scanner's GITHUB_TOKEN do not trigger `push`, see plans/news-sleeve/PLAN.md D13).
name: pages

on:
  push:
    branches: [main]
    paths: ["memory/**", "site/**", "scripts/dashboard.py", "scripts/newslib.py", "scripts/tlib.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [ "$code" = 200 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled (HTTP $code). Settings -> Pages -> Source: GitHub Actions. Dashboard not deployed; nothing else is affected."
          fi
      - name: Build site
        run: python3 scripts/dashboard.py --out _site
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
